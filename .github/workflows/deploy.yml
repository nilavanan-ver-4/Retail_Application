name: Deploy

# Manual, gated release. Nothing deploys unless the full CI workflow passes first.
on:
  workflow_dispatch:
    inputs:
      ref: {description: "Git ref (tag) to release", required: true, default: "main"}

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.ref }}
      # The release is then rolled out on the host with docs/OPERATIONS.md ("Deploy / roll back"):
      #   backup -> docker compose pull -> docker compose run --rm migrate -> docker compose up -d -> health check.
