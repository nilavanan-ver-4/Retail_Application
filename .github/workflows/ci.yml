name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Immutable revision selected by the release workflow
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, static analysis, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements/dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Bandit (SAST)
        run: bandit -q -r apps config -c pyproject.toml
      - name: pip-audit (known vulnerabilities in pinned dependencies)
        run: pip-audit -r requirements/base.txt --strict

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: retail, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: retail}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://retail:ci_only_password@localhost:5432/retail
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 postgresql-client
      - run: pip install -r requirements/dev.txt -r requirements/legacy.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Production deployment check
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "true"
          SECRET_KEY: ${{ github.sha }}-ci-only-0123456789-abcdefghijklmnopqrstuvwxyz-QWERTYUIOP
      - name: Migrate from scratch + role sync
        run: python manage.py migrate --noinput && python manage.py setup_roles
      - name: Test suite with coverage
        run: pytest --cov=apps --cov-report=xml --cov-report=term -n 2
      - name: Coverage gate
        run: coverage report --fail-under=85
      - name: Backup / restore verification round trip
        run: |
          export MEDIA_ROOT=$PWD/media BACKUP_DIR=$PWD/backups PYTHON=python
          mkdir -p "$MEDIA_ROOT"
          set_dir=$(bash scripts/backup.sh | tail -n1)
          bash scripts/verify_restore.sh "$set_dir"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coverage, path: coverage.xml}

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: retail, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: retail}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://retail:ci_only_password@localhost:5432/retail
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements/dev.txt && playwright install --with-deps chromium
      - run: pytest tests/e2e -m e2e -p no:cacheprovider

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, load: true, tags: "retail:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max"}
      - name: Container runs as non-root and passes its health probe
        run: |
          docker run --rm retail:ci id -u | grep -qx 10001
          cp .env.example .env && POSTGRES_PASSWORD=ci docker compose config -q
