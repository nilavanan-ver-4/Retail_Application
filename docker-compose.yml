# Production-style stack: Nginx (public) -> Gunicorn/Django (private) -> PostgreSQL (private).
# The database publishes NO ports: it is reachable only from the `backend` network.
# Secrets come from .env (never committed) - copy .env.example and fill it in.
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy: {resources: {limits: {memory: 1g}}}

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-retail}
      MEDIA_ROOT: /data/media
      XDG_CACHE_HOME: /tmp/.cache # writable font cache for PDF rendering with read_only: true
      TRUST_PROXY_SSL_HEADER: "true"
      FORWARDED_ALLOW_IPS: "*"   # only nginx can reach this container (private network)
    depends_on:
      db: {condition: service_healthy}
    volumes: [media:/data/media]
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 768m, cpus: "2"}}}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"] # local: HTTP_BIND=127.0.0.1, HTTP_PORT=8000
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  # one-off job:  docker compose run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-retail}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py setup_roles"]
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]

volumes:
  pgdata:
  media:

networks:
  backend: {internal: true}   # no route to the internet or the host
  frontend: {}
