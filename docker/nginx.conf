# Reverse proxy. Add a TLS `listen 443 ssl` server (or terminate TLS at a load balancer) in production.
upstream django { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;          # matches MAX_UPLOAD_MB (+ form overhead)
    server_tokens off;

    # uploaded product images only; served with a fixed type and never executed
    location /media/ {
        alias /data/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        autoindex off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
