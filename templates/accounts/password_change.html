{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
{% if validlink == False %}<div class="card"><p class="error">This reset link is invalid or has expired.</p><a href="{% url 'accounts:password_reset' %}">Request a new one</a></div>
{% else %}<form method="post" class="card form" novalidate>{% csrf_token %}{% include "generic/form_fields.html" %}
<div class="form-actions"><button class="btn primary" type="submit">Update password</button></div></form>{% endif %}
{% endblock %}
