{% extends "base.html" %}{% load static %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login">
  <img src="{% static 'img/logo.jpg' %}" alt="" width="64" height="64">
  <h1 style="text-align:center">{{ BUSINESS.NAME }}</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include "generic/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
  </form>
  <p style="text-align:center"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
</div>
{% endblock %}
