{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="post" class="card form" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {% include "generic/form_fields.html" %}
  <div class="form-actions">
    <button class="btn primary" type="submit">{{ submit_label|default:"Save" }}</button>
    <a class="btn" href="{{ cancel_url|default:'javascript:history.back()' }}">Cancel</a>
  </div>
</form>
{% endblock %}
