{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="post" class="card form">{% csrf_token %}
  <p>{{ message }}</p>
  {% if form %}{% include "generic/form_fields.html" %}{% endif %}
  <div class="form-actions"><button class="btn danger" type="submit">{{ submit_label|default:"Confirm" }}</button>
  <a class="btn" href="{{ cancel_url }}">Cancel</a></div>
</form>
{% endblock %}
