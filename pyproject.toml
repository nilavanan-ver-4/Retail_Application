[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --reuse-db"
markers = [
    "characterization: compares Django behaviour with recorded legacy Flask behaviour",
    "e2e: browser tests (need Playwright + chromium)",
    "slow: slower tests",
]
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*", "ignore:No directory at"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["legacy_flask", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]
# DJ008/DJ012: cosmetic Django-style rules; DJ001: legacy-compatible nullable CharFields
ignore = ["S101", "E501", "DJ001", "DJ008", "DJ012", "B904", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S608", "S603", "S607", "E741"]
"tests/characterization/legacy_char.py" = ["E402", "E731"]
"apps/*/migrations/*" = ["E501", "I001"]
"scripts/*" = ["S603", "S607"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "apps/*/management/*"]
branch = true

[tool.bandit]
exclude_dirs = ["tests", "legacy_flask", ".venv", "venv"]
skips = ["B101"]
